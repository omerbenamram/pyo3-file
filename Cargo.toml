[package]
name = "pyo3-file"
description = "A small helper library for working with python file-like objects with rust"
homepage = "https://github.com/omerbenamram/pyo3-file"
repository = "https://github.com/omerbenamram/pyo3-file"
license = "MIT/Apache-2.0"
readme = "README.md"

version = "0.17.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2018"

[dependencies]
pyo3 = { version = "^0.29" }

[features]
# Describe the conversion in PyO3's introspection data, so that a `PyFileLikeObject` argument shows
# up as `SupportsRead[Any] | SupportsWrite[Any]` in a generated stub file instead of
# `_typeshed.Incomplete`. Opt-in and additive: it only turns on `pyo3/experimental-inspect`, which
# is itself experimental, and costs nothing when off.
experimental-inspect = ["pyo3/experimental-inspect"]
