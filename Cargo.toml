[package]
name = "pyo3-file"
description = "A small helper library for working with python file-like objects with rust"
homepage = "https://github.com/omerbenamram/pyo3-file"
repository = "https://github.com/omerbenamram/pyo3-file"
license = "MIT/Apache-2.0"
readme = "README.md"

version = "0.18.0"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
edition = "2018"
# Instructions for AI agents, not part of the crate.
exclude = [".claude/**", "AGENTS.md", "CLAUDE.md"]

[dependencies]
pyo3 = { version = "^0.30" }

[features]
experimental-inspect = ["pyo3/experimental-inspect"]
